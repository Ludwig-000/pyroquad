name: Manual Windows GL Test

on:
  workflow_dispatch:

jobs:
  gl-test:
    name: OpenGL Window & Shader Check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install Mesa to deterministic absolute location
      - name: Install Mesa (Modern OpenGL Driver)
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          version: 24.0.5
          path: C:\mesa

      - name: Aggressive Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-shared-gl-test-abi_310

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --out dist --features abi_310 --no-default-features --interpreter python3.10

      - name: Install Wheel
        run: |
          pip install --no-index --find-links=dist pyroquad

      - name: Run Smoke Test
        shell: bash
        env:
          RUST_BACKTRACE: 1
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -e

          echo "PWD: $(pwd)"

          # Convert Windows path C:\mesa to MSYS path
          MESA_ROOT="/c/mesa"

          if [ ! -d "$MESA_ROOT" ]; then
            echo "::error::Mesa root directory not found at $MESA_ROOT"
            ls /c || true
            exit 1
          fi

          echo "Listing Mesa directory:"
          ls -R "$MESA_ROOT" || true

          MESA_DLL_PATH=$(find "$MESA_ROOT" -name opengl32.dll | head -n 1)

          if [ -z "$MESA_DLL_PATH" ]; then
            echo "::error::Mesa opengl32.dll not found"
            exit 1
          fi

          echo "Using Mesa DLL at: $MESA_DLL_PATH"

          # Prepend directory containing opengl32.dll to PATH
          export PATH="$(dirname "$MESA_DLL_PATH"):$PATH"

          which python

          python tests/basic_test.py