name: Manual Windows GL Test

on:
  workflow_dispatch:

jobs:
  gl-test:
    name: OpenGL Window & Shader Check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Mesa (Modern OpenGL Driver)
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          version: 24.0.5
          path: ${{ github.workspace }}\mesa_driver

      - name: Aggressive Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-shared-gl-test-abi_310

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --out dist --features abi_310 --no-default-features --interpreter python3.10

      - name: Install Wheel
        run: |
          pip install --no-index --find-links=dist pyroquad

      - name: Run Smoke Test
        shell: bash
        env:
          RUST_BACKTRACE: 1
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -e

          echo "Workspace: $GITHUB_WORKSPACE"

          MESA_DIR="$GITHUB_WORKSPACE/mesa_driver"

          echo "Listing Mesa directory:"
          ls -R "$MESA_DIR" || true

          # Locate opengl32.dll deterministically inside Mesa install dir
          MESA_DLL_PATH=$(find "$MESA_DIR" -name opengl32.dll | head -n 1)

          if [ -z "$MESA_DLL_PATH" ]; then
            echo "::error::Mesa opengl32.dll not found"
            exit 1
          fi

          echo "Using Mesa DLL at: $MESA_DLL_PATH"

          # Prepend Mesa directory (containing the DLL) to PATH
          export PATH="$(dirname "$MESA_DLL_PATH"):$PATH"

          echo "PATH updated. Verifying resolution:"
          which python

          python tests/basic_test.py