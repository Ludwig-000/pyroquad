name: Manual Windows GL Test

on:
  workflow_dispatch:

jobs:
  gl-test:
    name: OpenGL Window & Shader Check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Mesa (Modern OpenGL Driver)
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          version: 24.0.5
          path: C:\mesa-driver

      - name: Aggressive Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-shared-gl-test-abi_310

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --out dist --features abi_310 --no-default-features --interpreter python3.10

      - name: Install Wheel
        run: |
          pip install --no-index --find-links=dist pyroquad

      - name: Run Smoke Test
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          $ErrorActionPreference = "Stop"

          $mesaRoot = "C:\mesa-driver"

          if (!(Test-Path $mesaRoot)) {
              Write-Error "Mesa directory not found at $mesaRoot"
          }

          $dll = Get-ChildItem -Path $mesaRoot -Recurse -Filter opengl32.dll | Select-Object -First 1

          if (!$dll) {
              Write-Error "opengl32.dll not found inside Mesa directory"
          }

          Write-Host "Using Mesa DLL at $($dll.FullName)"

          # Prepend Mesa directory so it overrides system OpenGL
          $env:PATH = "$($dll.Directory.FullName);$env:PATH"

          where.exe opengl32.dll

          python tests/basic_test.py