name: Manual Windows GL Test

on:
  workflow_dispatch:

jobs:
  gl-test:
    name: OpenGL Window & Shader Check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Mesa (Modern OpenGL Driver)
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          version: 24.0.5

      - name: Aggressive Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-shared-gl-test-abi_310

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --out dist --features abi_310 --no-default-features --interpreter python3.10

      - name: Install Wheel
        run: |
          pip install --no-index --find-links=dist pyroquad

      - name: Run Smoke Test
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "PATH after Mesa install:"
          Write-Host $env:PATH

          # Ensure Mesa directory is first in PATH
          $mesaDir = ($env:PATH -split ';' | Where-Object { $_ -match "mesa" })[0]

          if (-not $mesaDir) {
              Write-Error "Mesa directory not found in PATH"
          }

          Write-Host "Using Mesa directory: $mesaDir"

          $env:PATH = "$mesaDir;$env:PATH"

          where.exe opengl32.dll

          python tests/basic_test.py