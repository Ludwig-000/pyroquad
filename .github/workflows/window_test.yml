name: Manual Windows GL Test

on:
  workflow_dispatch: # This makes it "Manual Only"

jobs:
  gl-test:
    name: OpenGL Window & Shader Check
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Mesa (Modern OpenGL Driver)
        # This provides the opengl32.dll that supports shaders
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          version: 24.0.5
          path: ${{ github.workspace }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Link (Debug)
        uses: PyO3/maturin-action@v1
        with:
          command: develop # Directly installs into python env for testing
          args: --features abi_310 --no-default-features

      - name: Run Smoke Test
        run: |
          # We run your test script here
          python test/basic_test.py