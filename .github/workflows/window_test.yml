name: Manual Windows GL Test

on:
  workflow_dispatch: 

jobs:
  gl-test:
    name: OpenGL Window & Shader Check
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Mesa (Modern OpenGL Driver)
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          version: 24.0.5
          # Installing into a subfolder to keep things tidy
          path: ${{ github.workspace }}\mesa_driver

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --features abi_310 --no-default-features --interpreter python3.10

      - name: Install Wheel
        run: |
          pip install --no-index --find-links=dist pyroquad

      - name: Run Smoke Test
        shell: bash
        env:
          # Force software rendering and show full Rust errors if it crashes
          RUST_BACKTRACE: 1
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          # 1. Identify the Python directory
          PYTHON_BIN_DIR=$(dirname $(which python))
          
          # 2. Force-inject Mesa DLL into the Python folder 
          # (This overrides the system's broken opengl32.dll)
          cp "${{ github.workspace }}/mesa_driver/opengl32.dll" "$PYTHON_BIN_DIR/"
          
          # 3. Run the test
          python tests/basic_test.py