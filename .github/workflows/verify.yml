name: Does it compile?

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]


permissions:
  contents: read
jobs:
  compile:
    name: Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev libxrandr-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Maturin Build Check
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --features abi_310 --interpreter python3.10