name: Wayland Test

# Opens a native Wayland window (no X server at all) and uses it - see tests/wayland_test.py.
#
# The compositor is sway with the pixman (CPU) renderer, nested in Xvfb (see the
# "Start Sway" step for why). The engine renders with Mesa's software GL (llvmpipe)
# and hands frames to sway through wl_shm, so no GPU is needed.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wayland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wayland:
    name: Native Wayland Window
    # Pinned instead of ubuntu-latest, so a new image can't silently change the compositor.
    #
    # Must ship libwayland >= 1.23 (26.04 has 1.24). miniquad 0.4.8 dlsym's two
    # functions added in 1.23 (wl_display_create_queue_with_name, wl_event_queue_get_name)
    # and panics without them, even though it never calls either. On ubuntu-24.04
    # (libwayland 1.22) the Wayland backend can't start at all.
    # TODO: patch those two declarations out of miniquad, then move this back to 24.04
    # so the test covers older libwayland too.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wayland-test

      # The X11 dev packages are still needed to *build*: the crate links libX11
      # even though this test never talks to an X server.
      # The rest is what miniquad dlopens at runtime for Wayland, plus the compositor.
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev pulseaudio python3-venv \
            sway xvfb libwayland-client0 libwayland-egl1 libxkbcommon0 libegl1 libegl-mesa0 libgl1-mesa-dri
          echo "libwayland-client: $(dpkg-query -W -f='${Version}' libwayland-client0)"
          echo "sway: $(sway --version)"

      # The distro's Python in a venv instead of actions/setup-python, which
      # may not have builds for a brand-new runner image yet.
      - name: Set up Python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build and Install pyroquad
        run: |
          python --version
          python -m pip install "maturin>=1.9,<2"
          maturin build --features abi_310 --out dist -i python
          python -m pip install --no-index --find-links dist pyroquad

      # miniquad 0.4.8 needs the compositor's seat to already have a pointer when the
      # window is created: it passes the seat and the pointer straight into
      # wl_data_device_manager.get_data_device and wp_cursor_shape_manager_v1.get_pointer.
      # If either is null, libwayland kills the whole connection and EGL then fails
      # to initialize. Every real desktop has a pointer, but a headless compositor
      # has no input devices at all (no seat on Weston, an empty seat on sway).
      #
      # So sway runs nested in a virtual X server instead: wlroots' X11 backend always
      # creates a keyboard and a pointer for its window. Only the compositor talks to
      # X - the test itself runs with DISPLAY unset and sees nothing but Wayland.
      - name: Start Sway (nested in Xvfb)
        env:
          WLR_BACKENDS: x11
          WLR_RENDERER: pixman
          WLR_X11_OUTPUTS: "1"
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          Xvfb :99 -screen 0 1024x768x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done

          # No Xwayland: nothing inside the compositor should be able to reach X either.
          echo "xwayland disable" > "$RUNNER_TEMP/sway.conf"
          DISPLAY=:99 sway -d -c "$RUNNER_TEMP/sway.conf" > "$RUNNER_TEMP/compositor.log" 2>&1 &

          for i in $(seq 1 50); do
            SOCK=$(cd "$XDG_RUNTIME_DIR" && ls wayland-* 2>/dev/null | grep -v '\.lock$' | head -n1 || true)
            if [ -n "$SOCK" ] && [ -S "$XDG_RUNTIME_DIR/$SOCK" ]; then
              echo "sway is up on $SOCK"
              echo "WAYLAND_DISPLAY=$SOCK" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::sway did not create its socket"
          cat "$RUNNER_TEMP/compositor.log"
          exit 1

      - name: Wayland Window Test
        env:
          # Mesa: render on the CPU and present through wl_shm.
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: wayland
          WAYLAND_TEST_SCREENSHOT: ${{ runner.temp }}/wayland-frame.ppm
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          # No X server may be reachable, so a silent fallback to X11 can't hide a broken Wayland path.
          unset DISPLAY
          timeout 180 python tests/wayland_test.py

      - name: Upload Read-Back Frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-frame
          path: ${{ runner.temp }}/wayland-frame.ppm
          if-no-files-found: ignore

      - name: Compositor Log
        if: always()
        run: |
          tail -n 300 "$RUNNER_TEMP/compositor.log" || true
          echo "--- Xvfb ---"
          cat "$RUNNER_TEMP/xvfb.log" || true
