name: Wayland Test

# Opens a native Wayland window (no X server at all) and uses it - see tests/wayland_test.py.
#
# The compositor is a headless sway with the pixman (CPU) renderer. The engine
# renders with Mesa's software GL (llvmpipe) and hands frames to sway through
# wl_shm, so no GPU is needed.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wayland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wayland:
    name: Native Wayland Window
    # Pinned instead of ubuntu-latest, so a new image can't silently change the compositor.
    #
    # Must ship libwayland >= 1.23 (26.04 has 1.24). miniquad 0.4.8 dlsym's two
    # functions added in 1.23 (wl_display_create_queue_with_name, wl_event_queue_get_name)
    # and panics without them, even though it never calls either. On ubuntu-24.04
    # (libwayland 1.22) the Wayland backend can't start at all.
    # TODO: patch those two declarations out of miniquad, then move this back to 24.04
    # so the test covers older libwayland too.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wayland-test

      # The X11 dev packages are still needed to *build*: the crate links libX11
      # even though this test never talks to an X server.
      # The rest is what miniquad dlopens at runtime for Wayland, plus the compositor.
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev pulseaudio python3-venv \
            sway libwayland-client0 libwayland-egl1 libxkbcommon0 libegl1 libegl-mesa0 libgl1-mesa-dri
          echo "libwayland-client: $(dpkg-query -W -f='${Version}' libwayland-client0)"
          echo "sway: $(sway --version)"

      # The distro's Python in a venv instead of actions/setup-python, which
      # may not have builds for a brand-new runner image yet.
      - name: Set up Python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build and Install pyroquad
        run: |
          python --version
          python -m pip install "maturin>=1.9,<2"
          maturin build --features abi_310 --out dist -i python
          python -m pip install --no-index --find-links dist pyroquad

      # sway rather than Weston: headless Weston has no input devices, so it
      # advertises no wl_seat. miniquad 0.4.8 assumes a seat always exists and passes
      # a null one to wl_data_device_manager.get_data_device, which kills the whole
      # Wayland connection (EGL then fails to initialize). wlroots compositors always
      # advertise a seat, even with no input devices - like every real desktop does.
      - name: Start Headless Sway
        env:
          WLR_BACKENDS: headless
          WLR_RENDERER: pixman
          WLR_HEADLESS_OUTPUTS: "1"
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          echo "output HEADLESS-1 resolution 1024x768" > "$RUNNER_TEMP/sway.conf"
          sway -d -c "$RUNNER_TEMP/sway.conf" > "$RUNNER_TEMP/compositor.log" 2>&1 &

          for i in $(seq 1 50); do
            SOCK=$(cd "$XDG_RUNTIME_DIR" && ls wayland-* 2>/dev/null | grep -v '\.lock$' | head -n1 || true)
            if [ -n "$SOCK" ] && [ -S "$XDG_RUNTIME_DIR/$SOCK" ]; then
              echo "sway is up on $SOCK"
              echo "WAYLAND_DISPLAY=$SOCK" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::sway did not create its socket"
          cat "$RUNNER_TEMP/compositor.log"
          exit 1

      - name: Wayland Window Test
        env:
          # Mesa: render on the CPU and present through wl_shm.
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: wayland
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          # No X server may be reachable, so a silent fallback to X11 can't hide a broken Wayland path.
          unset DISPLAY
          timeout 180 python tests/wayland_test.py

      - name: Compositor Log
        if: always()
        run: tail -n 300 "$RUNNER_TEMP/compositor.log" || true
