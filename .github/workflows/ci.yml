name: Pyroquad Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v0.0.1) This will automatically edit the version inside pyproject.toml'
        required: true


permissions:
  contents: write
  id-token: write



jobs:
  bump-version:
    name: Bump Version in Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pyproject.toml and Commit
        run: |
          VER="${{ github.event.inputs.version }}"
          VER="${VER#v}" # Strip leading 'v' if present

          # Single-line regex update using sed
          sed -i -E 's/^(version = ").*"/\1'"$VER"'"/' pyproject.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "automatic: bump version to $VER" || echo "No version change to commit"
          git push


  build:
    name: Build py${{ matrix.py_ver }} on ${{ matrix.os }}
    needs: bump-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, py_ver: "3.9", feat: "abi_39"}
          - {os: ubuntu-latest, py_ver: "3.10", feat: "abi_310"}
          - {os: ubuntu-latest, py_ver: "3.14", feat: "abi_314"}
          - {os: windows-latest, py_ver: "3.9", feat: "abi_39"}
          - {os: windows-latest, py_ver: "3.10", feat: "abi_310"}
          - {os: windows-latest, py_ver: "3.14", feat: "abi_314"}
          - {os: macos-latest, py_ver: "3.9", feat: "abi_39"}
          - {os: macos-latest, py_ver: "3.10", feat: "abi_310"}
          - {os: macos-latest, py_ver: "3.14", feat: "abi_314"}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # These are required for macroquad/miniquad to link successfully
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.feat }}

      - name: Set up Python ${{ matrix.py_ver }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_ver }}

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "false"
        with:
          command: build
          args: --release --out dist --features ${{ matrix.feat }} --interpreter python${{ matrix.py_ver }} --generate-stubs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyroquad-${{ matrix.os }}-py${{ matrix.py_ver }}
          path: dist/*.whl

  # Builds the browser half as a PEP 783 `pyemscripten_*_wasm32` wheel, so it
  # ships through PyPI alongside the native ones and can be installed in the
  # browser with `micropip.install("pyroquad")`.
  #
  # Unlike docs/WASM.md's hand-rolled `cargo build`, the cross-build environment
  # here is owned by `pyodide-build`: it decides the Emscripten version, the
  # RUSTFLAGS (`-sSIDE_MODULE=2` among them), the Rust toolchain and the platform
  # tag. That is what makes the wheel match the Pyodide that will load it, so
  # none of those are hardcoded below - they are all read back from its config.
  build-wasm:
    name: Build Pyodide Wheel (wasm32-emscripten)
    needs: bump-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # maturin >= 1.13.2 is the first release that emits the PEP 783 tag;
      # pyodide-build >= 0.39 is the first that cross-builds for CPython 3.14.
      - name: Install Build Tooling
        run: pip install "pyodide-build>=0.39" "maturin>=1.13.2"

      # The single source of truth for which Pyodide this targets is
      # web/get_pyodide.py, which is also what fetches the runtime that
      # check_imports.py resolves against. Importing it does not run its main().
      - name: Read the Pinned Pyodide Version
        id: pyodide
        run: |
          VER=$(python -c "import sys; sys.path.insert(0, 'web'); import get_pyodide; print(get_pyodide.DEFAULT_VERSION)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "targeting pyodide $VER"

      - name: Install the Pyodide Cross-Build Environment
        run: pyodide xbuildenv install "${{ steps.pyodide.outputs.version }}"

      - name: Read the Pyodide Build Configuration
        id: pyodide-config
        run: |
          echo "emscripten-version=$(pyodide config get emscripten_version)" >> "$GITHUB_OUTPUT"
          echo "rustflags=$(pyodide config get rustflags)" >> "$GITHUB_OUTPUT"
          echo "abi-version=$(pyodide config get pyodide_abi_version)" >> "$GITHUB_OUTPUT"

          # Pyodide's rustflags can carry -Z flags, which would need nightly.
          # Whatever it asks for is installed and forced below; stable is only
          # a fallback for a config that does not pin one.
          RT=$(pyodide config get rust_toolchain || true)
          [ -z "$RT" ] && RT=stable
          echo "rust-toolchain=$RT" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pyodide-config.outputs.rust-toolchain }}
          targets: wasm32-unknown-emscripten

      # No X11/ALSA/GL packages here: the browser build links against WebGL and
      # WebAudio through src/web/shim.c, not against the system libraries.
      #
      # The version is Pyodide's own, not the 6.0.8 used locally - building
      # against the exact emcc the runtime was built with removes the version
      # skew docs/WASM.md §3 had to argue its way around.
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.pyodide-config.outputs.emscripten-version }}
          actions-cache-folder: emsdk-cache

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-emscripten

      # CARGO_TARGET_<TARGET>_RUSTFLAGS, not plain RUSTFLAGS: this crate has a
      # build.rs, which is compiled for the *host*. Bare RUSTFLAGS would apply
      # the Emscripten side-module flags to it too and break the build script.
      #
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which pins stable and
      # would otherwise win over the toolchain installed above.
      - name: Build Pyodide Wheel
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: ${{ steps.pyodide-config.outputs.rustflags }}
          MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION: ${{ steps.pyodide-config.outputs.abi-version }}
          RUSTUP_TOOLCHAIN: ${{ steps.pyodide-config.outputs.rust-toolchain }}
          PYO3_CROSS_PYTHON_VERSION: "3.14"
        run: maturin build --release --target wasm32-unknown-emscripten --out dist --features abi_314

      - name: Cache the Pyodide runtime
        id: pyodide-cache
        uses: actions/cache@v4
        with:
          path: web/pyodide
          key: pyodide-${{ hashFiles('web/get_pyodide.py') }}

      - name: Fetch the Pyodide runtime
        if: steps.pyodide-cache.outputs.cache-hit != 'true'
        run: python web/get_pyodide.py

      # Every symbol the module imports has to be resolvable at dlopen time,
      # either by stock Pyodide or by the shim. Otherwise the only symptom is a
      # cryptic dlopen failure in the browser.
      #
      # Checked on the .so unpacked from the wheel rather than on cargo's
      # target/ output, so this gates the exact bytes that get published.
      - name: Check Imports Against Pyodide
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "built $WHEEL"
          python -m zipfile -e "$WHEEL" wheel_unpacked/
          SO=$(find wheel_unpacked -name '_pyroquad*.so' -print -quit)
          if [ -z "$SO" ]; then echo "no _pyroquad*.so inside $WHEEL"; exit 1; fi
          python web/check_imports.py "$SO"

      # Named pyroquad-* on purpose: the publish job's download pattern sweeps
      # this in with the native wheels, so it reaches both PyPI and the release.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyroquad-pyodide-wasm32
          path: dist/*.whl

  publish:
    name: Publish to PyPI & GitHub Release
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: release_dist
          pattern: pyroquad-*
          merge-multiple: true

      # This now includes the pyemscripten_*_wasm32 wheel from build-wasm, which
      # PyPI accepts since PEP 783. It cannot affect desktop installs: the
      # platform tag only matches inside Pyodide.
      - name: Publish package to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive release_dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.ref_name }}
          files: release_dist/*.whl
          body: |
            Alpha release of Pyroquad Engine.

            Includes the `pyemscripten_*_wasm32` wheel for running in the browser
            under Pyodide - `micropip.install("pyroquad")`. See
            [docs/WASM.md](docs/WASM.md).
          generate_release_notes: true