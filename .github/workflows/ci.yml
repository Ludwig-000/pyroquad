name: Pyroquad Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write
  id-token: write



jobs:
  build:
    name: Build py${{ matrix.py_ver }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, py_ver: "3.9", feat: "abi_39"}
          - {os: ubuntu-latest, py_ver: "3.10", feat: "abi_310"}
          - {os: ubuntu-latest, py_ver: "3.14", feat: "abi_314"}
          - {os: windows-latest, py_ver: "3.9", feat: "abi_39"}
          - {os: windows-latest, py_ver: "3.10", feat: "abi_310"}
          - {os: windows-latest, py_ver: "3.14", feat: "abi_314"}
          - {os: macos-latest, py_ver: "3.9", feat: "abi_39"}
          - {os: macos-latest, py_ver: "3.10", feat: "abi_310"}
          - {os: macos-latest, py_ver: "3.14", feat: "abi_314"}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # These are required for macroquad/miniquad to link successfully
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.feat }}

      - name: Set up Python ${{ matrix.py_ver }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_ver }}

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "false"
        with:
          command: build
          args: --release --out dist --features ${{ matrix.feat }} --interpreter python${{ matrix.py_ver }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyroquad-${{ matrix.os }}-py${{ matrix.py_ver }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI & GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: release_dist
          pattern: pyroquad-*
          merge-multiple: true

      - name: Publish package to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive release_dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: release_dist/*.whl
          body: "Pre-alpha release of Pyroquad Engine."
          generate_release_notes: true